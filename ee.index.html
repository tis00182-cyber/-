<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web iPhone KakaoTalk</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            user-select: none;
        }

        body {
            background-color: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* 아이폰 외관 프레임 */
        .iphone {
            width: 375px;
            height: 780px;
            background: 




            border-radius: 50px;
            border: 12px solid #2d3436;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }

        /* 다이내믹 아일랜드 */
        .dynamic-island {
            width: 110px;
            height: 28px;
            background-color: black;
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 20px;
            z-index: 100;
        }

        /* 상단 상태바 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-size: 14px;
            font-weight: 600;
            padding: 14px 20px 0 20px;
            z-index: 90;
            transition: color 0.3s;
        }

        .status-icons {
            display: flex;
            gap: 6px;
            font-size: 12px;
        }

        /* 📱 1. 홈 화면 (Home Screen) */
        .home-screen {
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            position: relative;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px 15px;
            margin-top: 45px;
        }

        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        .app-item:active {
            transform: scale(0.9);
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative;
        }

        .app-name {
            color: white;
            font-size: 11px;
            margin-top: 6px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        /* 앱 개별 아이콘 스타일 */
        .kakaotalk-icon { background-color: #FFE812; color: #3C1E1E; }
        .safari-icon { background: linear-gradient(135deg, #2980b9, #3498db); }
        .message-icon { background: linear-gradient(135deg, #2ecc71, #27ae60); }
        .youtube-icon { background-color: #ff0000; }
        .photos-icon { background: white; color: #ff7675; }
        .settings-icon { background: linear-gradient(135deg, #7f8c8d, #bdc3c7); }

        .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background-color: #ff3b30;
            color: white;
            font-size: 11px;
            font-weight: bold;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 하단 독 (Dock) */
        .dock {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-around;
            margin-bottom: 5px;
        }

        /* 💬 2. 카카오톡 대화창 (KakaoTalk Screen) */
        .kakao-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #bacdbe; /* 카카오톡 배경색 */
            display: flex;
            flex-direction: column;
            transform: translateY(100%); /* 처음엔 아래에 숨겨둠 */
            transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
            z-index: 80;
        }

        /* 카톡이 열렸을 때 올라오는 애니메이션 */
        .kakao-screen.active {
            transform: translateY(0);
        }

        .chat-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 45px 15px 10px 15px;
            background-color: rgba(186, 205, 190, 0.95);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 18px;
            cursor: pointer;
        }

        .chat-title {
            font-size: 16px;
            font-weight: bold;
        }

        /* 대화 내역 */
        .chat-room {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .date-divider {
            text-align: center;
            margin: 10px 0;
        }

        .date-divider span {
            background-color: rgba(0, 0, 0, 0.1);
            color: white;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 10px;
        }

        /* 상대방 말풍선 */
        .msg-other {
            display: flex;
            gap: 8px;
            align-items: flex-start;
        }

        .profile-img {
            width: 40px;
            height: 40px;
            border-radius: 15px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #666;
            flex-shrink: 0;
        }

        .msg-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-width: 200px;
        }

        .sender-name {
            font-size: 12px;
            color: #555;
        }

        .bubble-other {
            background-color: #ffffff;
            padding: 9px 12px;
            border-radius: 12px;
            border-top-left-radius: 2px;
            font-size: 14px;
            color: #000;
            line-height: 1.4;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        /* 내 말풍선 */
        .msg-me {
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            gap: 4px;
        }

        .bubble-me {
            background-color: #ffe812;
            padding: 9px 12px;
            border-radius: 12px;
            border-top-right-radius: 2px;
            font-size: 14px;
            color: #000;
            line-height: 1.4;
            max-width: 220px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .msg-time {
            font-size: 10px;
            color: #666;
            margin-bottom: 2px;
        }

        /* 하단 입력바 */
        .chat-input-bar {
            background-color: #ffffff;
            padding: 10px 15px 15px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-box {
            flex: 1;
            background-color: #f2f2f2;
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 14px;
            color: #aaa;
        }

        .send-btn {
            background-color: #ffe812;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3c1e1e;
            font-size: 14px;
        }

        /* 홈 바 (누르면 홈으로 이동) */
        .home-bar {
            width: 130px;
            height: 4px;
            background-color: #000;
            border-radius: 2px;
            margin: 4px auto 8px auto;
            cursor: pointer;
            z-index: 100;
        }

        .home-screen .home-bar {
            background-color: #fff;
        }
    </style>
</head>
<body>

    <div class="iphone">
        <!-- 다이내믹 아일랜드 -->
        <div class="dynamic-island"></div>

        <!-- 상단 시계/상태바 -->
        <div class="status-bar" id="statusBar">
            <span id="clock">12:00</span>
            <div class="status-icons">
                <i class="fas fa-signal"></i>
                <i class="fas fa-wifi"></i>
                <i class="fas fa-battery-full"></i>
            </div>
        </div>

        <!-- 📱 1. 아이폰 홈 화면 -->
        <div class="home-screen">
            <div class="app-grid">
                <!-- 🟡 카카오톡 앱 (클릭 시 카톡 열림) -->
                <div class="app-item" onclick="openKakao()">
                    <div class="app-icon kakaotalk-icon">
                        <i class="fas fa-comment"></i>
                        <div class="badge">1</div>
                    </div>
                    <span class="app-name">카카오톡</span>
                </div>

                <!-- 다른 앱 예시들 -->
                <div class="app-item">
                    <div class="app-icon message-icon"><i class="fas fa-comments"></i></div>
                    <span class="app-name">메시지</span>
                </div>
                <div class="app-item">
                    <div class="app-icon youtube-icon"><i class="fab fa-youtube"></i></div>
                    <span class="app-name">YouTube</span>
                </div>
                <div class="app-item">
                    <div class="app-icon photos-icon"><i class="fas fa-images"></i></div>
                    <span class="app-name">사진</span>
                </div>
                <div class="app-item">
                    <div class="app-icon settings-icon"><i class="fas fa-cog"></i></div>
                    <span class="app-name">설정</span>
                </div>
            </div>

            <!-- 하단 독 바 -->
            <div>
                <div class="dock">
                    <div class="app-item">
                        <div class="app-icon safari-icon"><i class="fas fa-compass"></i></div>
                    </div>
                    <div class="app-item" onclick="openKakao()">
                        <div class="app-icon kakaotalk-icon"><i class="fas fa-comment"></i></div>
                    </div>
                </div>
                <div class="home-bar"></div>
            </div>
        </div>

        <!-- 💬 2. 카카오톡 대화 화면 -->
        <div class="kakao-screen" id="kakaoScreen">
            <!-- 상단 헤더 -->
            <div class="chat-header">
                <div class="header-left" onclick="closeKakao()">
                    <i class="fas fa-chevron-left"></i>
                    <span class="chat-title">기현</span>
                </div>
                <div>
                    <i class="fas fa-search" style="margin-right: 12px;"></i>
                    <i class="fas fa-bars"></i>
                </div>
            </div>

            <!-- 대화 영역 -->
            <div class="chat-room">
                <div class="date-divider">
                    <span>2026년 10월 21일 수요일</span>
                </div>

                <!-- 상대방 메시지 -->
                <div class="msg-other">
                    <div class="profile-img"><i class="fas fa-user"></i></div>
                    <div class="msg-content">
                        <span class="sender-name">기현</span>
                        <div class="bubble-other">
                            민혁아 아무리 생각해봐도 이건 아니야
                        </div>
                    </div>
                    <span class="msg-time">오후 6:00</span>
                </div>

                <!-- 내 메시지 -->
                <div class="msg-me">
                    <span class="msg-time">오후 6:01</span>
                    <div class="bubble-me">
                        ㅗ
                    </div>
                </div>

                <!-- 상대방 메시지 -->
                <div class="msg-other">
                    <div class="profile-img"><i class="fas fa-user"></i></div>
                    <div class="msg-content">
                        <span class="sender-name">기현</span>
                        <div class="bubble-other">
                            뭐 느끼는 거 없어?
                        </div>
                    </div>
                    <span class="msg-time">오후 6:02</span>
                </div>
            </div>

            <!-- 하단 입력바 -->
            <div class="chat-input-bar">
                <i class="far fa-plus-square" style="font-size: 20px; color: #666;"></i>
                <div class="input-box">메시지 보내기</div>
                <div class="send-btn"><i class="fas fa-arrow-up"></i></div>
            </div>

            <!-- 홈으로 나가는 바 -->
            <div class="home-bar" onclick="closeKakao()"></div>
        </div>

    </div>

    <script>
        // 시계 업데이트
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').innerText = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // 카카오톡 열기
        function openKakao() {
            document.getElementById('kakaoScreen').classList.add('active');
            document.getElementById('statusBar').style.color = '#000';
        }

        // 카카오톡 닫기 (홈화면으로 이동)
        function closeKakao() {
            document.getElementById('kakaoScreen').classList.remove('active');
            document.getElementById('statusBar').style.color = '#fff';
        }
    </script>
</body>
</html>
